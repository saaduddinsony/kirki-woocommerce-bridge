name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
      - name: Install dependencies
        if: matrix.php == '8.3'
        run: composer install --no-interaction --no-progress
      - name: WordPress Coding Standards
        if: matrix.php == '8.3'
        run: vendor/bin/phpcs
      - name: JavaScript syntax
        if: matrix.php == '8.3'
        run: for f in assets/js/*.js tests/e2e/*.js playwright.config.js; do node --check "$f"; done

  integration:
    name: Integration (${{ matrix.combo }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        combo: ['woocommerce', 'woocommerce + kirki-ecommerce']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3, intl, mbstring
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          npm ci
          npx playwright install --with-deps chromium
      - name: Set up WordPress + WooCommerce + Kirki (SQLite)
        env:
          EXTRA_PLUGINS: ${{ contains(matrix.combo, 'kirki-ecommerce') && 'https://downloads.wordpress.org/plugin/kirki-ecommerce.latest-stable.zip' || '' }}
        run: bin/setup-test-site.sh "$RUNNER_TEMP/wp"
      - name: REST smoke test
        run: php -d memory_limit=1024M "$RUNNER_TEMP/wp/wp-cli.phar" --path="$RUNNER_TEMP/wp/site" eval-file tests/bin/smoke.php
      - name: PHPUnit
        run: KIRKI_WOO_WP_LOAD="$RUNNER_TEMP/wp/site/wp-load.php" vendor/bin/phpunit
      - name: Playwright storefront E2E
        run: npx playwright test tests/e2e/storefront.spec.js
        env:
          WP_BASE_URL: http://127.0.0.1:8895
      - name: Fail on PHP warnings
        run: |
          if grep -E "PHP (Fatal|Warning|Parse)" "$RUNNER_TEMP/wp/site/wp-content/debug.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ strategy.job-index }}
          path: |
            test-results/
            ${{ runner.temp }}/wp/site/wp-content/debug.log
            ${{ runner.temp }}/wp/server.log

  package:
    name: Build zip
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kirki-woocommerce-bridge-zip
          path: build/*.zip
